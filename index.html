<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouFi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f2f2f7; --text: #000; --muted: #8e8e93; --accent: #007aff;
            --card: rgba(255,255,255,0.7); --border: rgba(0,0,0,0.05);
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #000; --text: #fff; --card: rgba(28,28,30,0.7); --border: rgba(255,255,255,0.1); }
        }
        body { font-family: -apple-system, system-ui; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 100px; transition: 0.3s; }
        
        /* Dashboard */
        .net-card { 
            background: linear-gradient(135deg, #1c1c1e, #444); color: #fff; 
            padding: 30px; border-radius: 28px; text-align: center; margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .net-card.positive { background: linear-gradient(135deg, #007aff, #00c6ff); }

        /* Lists */
        .section-header { font-size: 20px; font-weight: 700; margin: 20px 0 10px 5px; display: flex; justify-content: space-between; }
        .list { background: var(--card); backdrop-filter: blur(15px); border-radius: 20px; padding: 5px 15px; margin-bottom: 20px; }
        .item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--border); }
        .item:last-child { border-bottom: none; }
        .item-name { font-weight: 500; }
        .item-val { font-weight: 600; }

        /* Sheets */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .sheet { 
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); 
            border-radius: 25px 25px 0 0; padding: 25px; z-index: 101;
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .sheet.active { transform: translateY(0); }

        /* Inputs */
        input, select { 
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); font-size: 16px; margin-bottom: 10px; outline: none;
        }
        .amount-big { font-size: 40px; text-align: center; font-weight: 700; border: none; background: none; }

        .fab { 
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; 
            background: var(--text); color: var(--bg); border-radius: 30px; 
            border: none; font-size: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 50;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="net-card" id="netCard">
        <div style="opacity: 0.7; font-size: 13px; text-transform: uppercase;">Чистые активы</div>
        <div style="font-size: 42px; font-weight: 800; margin: 5px 0;" id="totalNet">0 ₽</div>
    </div>

    <div class="section-header">Активы <span id="addProd" style="color: var(--accent); font-size: 14px;">+ Добавить</span></div>
    <div class="list" id="assetList"></div>

    <details>
        <summary class="section-header">Обязательства</summary>
        <div class="list" id="debtList"></div>
    </details>

    <button class="fab" id="mainAdd">+</button>

    <div class="overlay" id="overlay"></div>

    <div class="sheet" id="txSheet">
        <select id="txType">
            <option value="Расход">Расход</option>
            <option value="Доход">Доход</option>
            <option value="Перевод">Перевод</option>
        </select>
        <input type="number" id="txAmount" class="amount-big" placeholder="0 ₽">
        
        <select id="txCard"></select>
        <select id="txToCard" class="hidden"></select>
        <select id="txCat"></select>
        <input type="text" id="txDesc" placeholder="Описание (или выбор долга)">
    </div>

    <div class="sheet" id="prodSheet">
        <div class="section-header">Новый продукт</div>
        <input type="text" id="pName" placeholder="Название (Т-Банк, Долг Игорю...)">
        <select id="pType">
            <option value="Дебетовая">Дебетовая карта</option>
            <option value="Наличные">Наличные</option>
            <option value="Кредит">Кредит/Долг (Обязательство)</option>
            <option value="Инвестиции">Инвестиции</option>
        </select>
        <input type="number" id="pBalance" placeholder="Начальный баланс">
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const API_URL = 'https://tmapf.vercel.app/'; // ЗАМЕНИТЬ!
        let products = [];

        // Категории
        const cats = {
            "Доход": ["Зарплата", "Проценты", "Инвестиции", "Кэшбэк", "Долг (вернули)", "Другое"],
            "Расход": ["Продукты", "Электроника", "Транспорт", "Жилье", "Здоровье", "Кредиты/Долги", "Другое"]
        };

        async function loadData() {
            // В реале тут fetch('/api/getProducts')
            // Для теста можно забить массив или сделать отдельный API GET
        }

        function render() {
            const assetList = document.getElementById('assetList');
            const debtList = document.getElementById('debtList');
            const txCard = document.getElementById('txCard');
            const txToCard = document.getElementById('txToCard');
            
            assetList.innerHTML = ''; debtList.innerHTML = ''; txCard.innerHTML = ''; txToCard.innerHTML = '';
            
            let total = 0;
            products.sort((a,b) => b.balance - a.balance).forEach(p => {
                const isDebt = p.type === 'Кредит' || p.type === 'Долг';
                const html = `<div class="item"><span class="item-name">${p.name}</span><span class="item-val">${p.balance.toLocaleString()} ₽</span></div>`;
                
                if (isDebt) { debtList.innerHTML += html; total -= p.balance; }
                else { assetList.innerHTML += html; total += p.balance; }

                const opt = `<option value="${p.name}">${p.name}</option>`;
                txCard.innerHTML += opt;
                txToCard.innerHTML += opt;
            });

            document.getElementById('totalNet').innerText = `${total.toLocaleString()} ₽`;
            document.getElementById('netCard').className = total >= 0 ? 'net-card positive' : 'net-card';
        }

        // Логика UI
        document.getElementById('mainAdd').onclick = () => {
            showSheet('txSheet');
            updateCats();
        };
        document.getElementById('addProd').onclick = () => showSheet('prodSheet');
        document.getElementById('overlay').onclick = closeAll;

        function showSheet(id) {
            document.getElementById('overlay').classList.add('active');
            document.getElementById(id).classList.add('active');
            tg.MainButton.setText('СОХРАНИТЬ').show();
            tg.MainButton.onClick(() => handleSave(id));
        }

        function closeAll() {
            document.querySelectorAll('.sheet, .overlay').forEach(el => el.classList.remove('active'));
            tg.MainButton.hide();
        }

        document.getElementById('txType').onchange = (e) => {
            const isTransfer = e.target.value === 'Перевод';
            document.getElementById('txToCard').classList.toggle('hidden', !isTransfer);
            document.getElementById('txCat').classList.toggle('hidden', isTransfer);
            updateCats();
        };

        function updateCats() {
            const type = document.getElementById('txType').value;
            const catSelect = document.getElementById('txCat');
            catSelect.innerHTML = (cats[type] || []).map(c => `<option value="${c}">${c}</option>`).join('');
        }

       async function handleSave(id) {
            tg.MainButton.showProgress();
            let url = id === 'txSheet' ? `${API_URL}/addTransaction` : `${API_URL}/addProduct`;
            let data = {};

            if (id === 'txSheet') {
                data = {
                    type: document.getElementById('txType').value,
                    amount: document.getElementById('txAmount').value,
                    card: document.getElementById('txCard').value,
                    toCard: document.getElementById('txToCard').value,
                    category: document.getElementById('txCat').value,
                    description: document.getElementById('txDesc').value
                };
            } else {
                data = {
                    name: document.getElementById('pName').value,
                    type: document.getElementById('pType').value,
                    balance: document.getElementById('pBalance').value
                };
            }

            // Оборачиваем запрос в try...catch, чтобы ловить ошибки
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    tg.HapticFeedback.notificationOccurred('success');
                    location.reload();
                } else {
                    const errData = await res.json();
                    tg.showAlert('Ответ сервера: ' + errData.error);
                }
            } catch (error) {
                // Если нет интернета или ошибка CORS
                tg.showAlert('Ошибка сети: ' + error.message);
            } finally {
                // Это выполнится В ЛЮБОМ СЛУЧАЕ, и вечной загрузки больше не будет
                tg.MainButton.hideProgress();
            }
        }
    </script>
</body>
</html>
