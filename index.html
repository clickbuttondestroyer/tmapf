<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouFi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f2f2f7; --text: #000; --muted: #8e8e93; --accent: #007aff;
            --card: rgba(255,255,255,0.8); --border: rgba(0,0,0,0.08);
            --positive: #34c759; --danger: #ff3b30; --tab-bg: rgba(255,255,255,0.9);
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #000; --text: #fff; --card: rgba(28,28,30,0.8); --border: rgba(255,255,255,0.15); --tab-bg: rgba(28,28,30,0.9); }
        }
        body { font-family: -apple-system, system-ui; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 140px; transition: 0.3s; overflow-x: hidden; }
        
        .screen { display: none; }
        .screen.active { display: block; }

        .net-card { 
            background: linear-gradient(135deg, #1c1c1e, #444); color: #fff; 
            padding: 35px 20px; border-radius: 32px; text-align: center; margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .net-card.positive { background: linear-gradient(135deg, #007aff, #00c6ff); }

        .section-header { font-size: 22px; font-weight: 700; margin: 25px 0 12px 5px; display: flex; justify-content: space-between; align-items: center; }
        .list { background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 24px; padding: 5px 18px; margin-bottom: 20px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
        .item:last-child { border-bottom: none; }
        .item-icon { width: 42px; height: 42px; background: var(--border); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-right: 14px; }
        .item-info { flex: 1; }
        .item-name { font-weight: 600; font-size: 16px; }
        .item-sub { font-size: 13px; color: var(--muted); display: block; }
        .item-val { font-weight: 700; font-size: 16px; }

        .date-divider { font-size: 13px; font-weight: 700; color: var(--muted); margin: 15px 0 8px 10px; text-transform: uppercase; }

        /* Filter Chips */
        .chips-container { display: flex; gap: 10px; overflow-x: auto; padding: 5px 5px 15px 5px; scrollbar-width: none; }
        .chips-container::-webkit-scrollbar { display: none; }
        .chip { padding: 8px 18px; background: var(--card); border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid var(--border); white-space: nowrap; cursor: pointer; }
        .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .tab-bar { 
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            background: var(--tab-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            height: 70px; border-radius: 25px; display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 90; border: 1px solid var(--border);
        }
        .tab-item { text-align: center; color: var(--muted); transition: 0.3s; flex: 1; cursor: pointer; }
        .tab-item.active { color: var(--accent); }
        .tab-icon { font-size: 24px; margin-bottom: 2px; }
        .tab-label { font-size: 10px; font-weight: 600; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100; backdrop-filter: blur(5px); }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .sheet { 
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); 
            border-radius: 35px 35px 0 0; padding: 30px 25px; z-index: 101;
            transform: translateY(100%); transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            max-height: 90vh; overflow-y: auto;
        }
        .sheet.active { transform: translateY(0); }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { width: 32px; height: 32px; background: var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }

        input, select { 
            width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); font-size: 17px; margin-bottom: 12px; outline: none; box-sizing: border-box;
        }
        label { font-size: 13px; color: var(--muted); margin: 0 0 6px 6px; display: block; font-weight: 600; text-transform: uppercase; }
        .amount-big { font-size: 48px; text-align: center; font-weight: 800; border: none !important; background: none !important; margin: 10px 0 25px 0; color: var(--text); }
        .btn-danger { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--danger); color: #fff; font-size: 17px; font-weight: 700; margin-top: 10px; }

        .fab { 
            position: fixed; bottom: 100px; right: 25px; width: 68px; height: 68px; 
            background: var(--text); color: var(--bg); border-radius: 34px; 
            border: none; font-size: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 50;
            display: flex; align-items: center; justify-content: center;
        }
        
        .arrow { transition: 0.3s; font-size: 14px; color: var(--accent); }
        details[open] summary .arrow { transform: rotate(90deg); }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Screen 1: Main -->
    <div id="screen-main" class="screen active">
        <div class="net-card" id="netCard">
            <div style="opacity: 0.7; font-size: 14px; text-transform: uppercase; font-weight: 700;">Чистые активы</div>
            <div style="font-size: 52px; font-weight: 800; margin: 10px 0;" id="totalNet">...</div>
        </div>

        <details open>
            <summary class="section-header">Активы <span style="display: flex; align-items: center; gap: 10px;"><span id="addProd" style="color: var(--accent); font-size: 14px; font-weight: 600;">+ Добавить</span><span class="arrow">▶</span></span></summary>
            <div id="assetList" class="list"></div>
        </details>

        <details><summary class="section-header">Обязательства <span class="arrow">▶</span></summary><div id="debtList" class="list"></div></details>

        <div class="section-header">История</div>
        <div id="txGrouped"></div>
    </div>

    <!-- Screen 2: Cashback -->
    <div id="screen-cashback" class="screen">
        <div class="section-header">Хаб кэшбэка <span id="addCashback" style="color: var(--accent); font-size: 14px;">+ Добавить</span></div>
        <div class="chips-container" id="cashbackChips"></div>
        <div id="cashbackList"></div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="tab-item active" onclick="switchScreen('main')">
            <div class="tab-icon">🏠</div><div class="tab-label">ГЛАВНАЯ</div>
        </div>
        <div class="tab-item" onclick="switchScreen('cashback')">
            <div class="tab-icon">💎</div><div class="tab-label">КЭШБЭК</div>
        </div>
    </div>

    <button class="fab" id="mainAdd">+</button>
    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <!-- Sheet: Transaction -->
    <div class="sheet" id="txSheet">
        <div class="sheet-header"><span id="txSheetTitle" style="font-size: 20px; font-weight: 800;">Новая операция</span><div class="close-btn" onclick="closeAll()">✕</div></div>
        <input type="number" id="txAmount" class="amount-big" placeholder="0" inputmode="decimal">
        <select id="txType">
            <option value="Расход">Расход</option>
            <option value="Доход">Доход</option>
            <option value="Перевод">Перевод</option>
        </select>
        <label id="lblFrom">Откуда</label><select id="txCard"></select>
        <div id="divTo" class="hidden"><label>Куда</label><select id="txToCard"></select></div>
        <div id="divCat"><label>Категория</label><select id="txCat"></select></div>
        <input type="text" id="txDesc" placeholder="Описание...">
        <button id="btnDeleteTx" class="btn-danger hidden">Удалить операцию</button>
    </div>

    <!-- Sheet: Cashback Add -->
    <div class="sheet" id="cashSheet">
        <div class="sheet-header"><span style="font-size: 20px; font-weight: 800;">Добавить кэшбэк</span><div class="close-btn" onclick="closeAll()">✕</div></div>
        <label>Источник (Карта или свое)</label>
        <input type="text" id="cashSource" list="sourceList" placeholder="Т-Банк, Яндекс Пэй...">
        <datalist id="sourceList"></datalist>
        <label>Категория</label>
        <input type="text" id="cashCat" placeholder="Супермаркеты, Такси...">
        <label>Процент (%)</label>
        <input type="number" id="cashPercent" placeholder="5" inputmode="numeric">
        <label>Период (Месяц)</label>
        <select id="cashPeriod"></select>
    </div>

    <!-- Sheet: Product -->
    <div class="sheet" id="prodSheet">
        <div class="sheet-header"><span style="font-size: 20px; font-weight: 800;">Новый продукт</span><div class="close-btn" onclick="closeAll()">✕</div></div>
        <input type="text" id="pName" placeholder="Название...">
        <select id="pType">
            <option value="Дебетовая">💳 Дебетовая карта</option>
            <option value="Наличные">💵 Наличные</option>
            <option value="Кредит">🏦 Кредит / Долг</option>
            <option value="Инвестиции">📈 Инвестиции</option>
            <option value="Вклад">💰 Вклад / Счёт</option>
        </select>
        <input type="number" id="pBalance" placeholder="Баланс" inputmode="decimal">
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const API_URL = window.location.origin + '/api';
        
        let products = [], transactions = [], cashbackData = [], editingTxId = null, currentCashFilter = 'Все';

        const smartIcons = {
            "🛒": ["супермаркет", "продукт", "еда", "пятерочка", "магнит", "перекресток", "ашан", "дикси", "лента"],
            "🚕": ["такси", "яндекс", "uber", "драйв", "drive", "машина"],
            "💊": ["аптек", "здоров", "медицин", "клиник", "врач"],
            "🍔": ["ресторан", "кафе", "еда", "бургер", "пицца", "суши", "макдоналдс", "вкусно", "кфс", "kfc"],
            "🎬": ["кино", "театр", "развлеч", "билет", "отдых", "парк"],
            "🛍️": ["одежд", "обувь", "шопинг", "wildberries", "ozon", "озон", "вб"],
            "🚗": ["авто", "бензин", "азс", "запчаст", "сервис"],
            "🏠": ["жилье", "аренд", "дом", "ремонт", "мебель", "коммунал", "жкх"],
            "📱": ["связь", "интернет", "телефон", "подписк"],
            "🎓": ["образован", "курс", "обучен", "школа", "книг"]
        };

        const prodIcons = { "Дебетовая": "💳", "Наличные": "💵", "Кредит": "🏦", "Инвестиции": "📈", "Вклад": "💰" };
        const cats = { "Доход": ["Зарплата", "Проценты", "Инвестиции", "Кэшбэк", "Долг (вернули)", "Другое"], "Расход": ["Продукты", "Электроника", "Транспорт", "Жилье", "Здоровье", "Кредиты/Долги (погашение)", "Другое"] };

        function getSmartIcon(text) {
            text = text.toLowerCase();
            for (const [icon, keywords] of Object.entries(smartIcons)) {
                if (keywords.some(k => text.includes(k))) return icon;
            }
            return "🏷️";
        }

        async function init() {
            try {
                const [dRes, cRes] = await Promise.all([fetch(`${API_URL}/getData`), fetch(`${API_URL}/getCashback`)]);
                const data = await dRes.json();
                const cData = await cRes.json();
                products = data.products || [];
                transactions = data.transactions || [];
                cashbackData = cData.categories || [];
                render();
                setupPeriodSelect();
            } catch (e) { console.error(e); }
        }

        function setupPeriodSelect() {
            const select = document.getElementById('cashPeriod');
            select.innerHTML = '';
            const now = new Date();
            for (let i = 0; i < 3; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
                const val = `${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getFullYear()}`;
                const label = d.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
                select.innerHTML += `<option value="${val}">${label}</option>`;
            }
        }

        function switchScreen(name) {
            document.querySelectorAll('.screen, .tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`screen-${name}`).classList.add('active');
            document.querySelector(`.tab-item[onclick*="${name}"]`).classList.add('active');
        }

        function render() {
            const assetList = document.getElementById('assetList');
            const debtList = document.getElementById('debtList');
            const txGrouped = document.getElementById('txGrouped');
            const sourceList = document.getElementById('sourceList');
            
            assetList.innerHTML = ''; debtList.innerHTML = ''; txGrouped.innerHTML = ''; sourceList.innerHTML = '';
            
            // Продукты
            let total = 0;
            products.forEach(p => {
                const isDebt = p.type.includes('Кредит') || p.type.includes('Долг');
                const icon = prodIcons[Object.keys(prodIcons).find(k => p.type.includes(k))] || "💳";
                const html = `<div class="item"><div class="item-icon">${icon}</div><div class="item-info"><span class="item-name">${p.name}</span><span class="item-sub">${p.type}</span></div><span class="item-val">${p.balance.toLocaleString()} ₽</span></div>`;
                if (isDebt) { debtList.innerHTML += html; total -= p.balance; }
                else { assetList.innerHTML += html; total += p.balance; }
                sourceList.innerHTML += `<option value="${p.name}">`;
            });

            // История
            const groups = {};
            transactions.forEach(t => { if (!groups[t.date]) groups[t.date] = []; groups[t.date].push(t); });
            Object.entries(groups).forEach(([date, txs]) => {
                const div = document.createElement('div');
                div.innerHTML = `<div class="date-divider">${date}</div>`;
                const list = document.createElement('div');
                list.className = 'list';
                txs.forEach(t => {
                    const isPlus = t.type === 'Доход';
                    const icon = getSmartIcon(t.category || t.type);
                    list.innerHTML += `<div class="item" onclick='openEditTx(${JSON.stringify(t)})'><div class="item-icon">${icon}</div><div class="item-info"><span class="item-name">${t.category || t.type}</span><span class="item-sub">${t.card}</span></div><span class="item-val" style="color: ${isPlus ? 'var(--positive)' : 'inherit'}">${isPlus ? '+' : ''}${parseFloat(t.amount).toLocaleString()} ₽</span></div>`;
                });
                div.appendChild(list);
                txGrouped.appendChild(div);
            });

            // Кэшбэк чипсы
            const chips = document.getElementById('cashbackChips');
            const sources = ['Все', ...new Set(cashbackData.map(c => c.source))];
            chips.innerHTML = sources.map(s => `<div class="chip ${currentCashFilter === s ? 'active' : ''}" onclick="filterCash('${s}')">${s}</div>`).join('');

            // Кэшбэк список
            const cbList = document.getElementById('cashbackList');
            cbList.innerHTML = '';
            const filtered = currentCashFilter === 'Все' ? cashbackData : cashbackData.filter(c => c.source === currentCashFilter);
            
            const cbGrouped = {};
            filtered.forEach(c => { if (!cbGrouped[c.source]) cbGrouped[c.source] = []; cbGrouped[c.source].push(c); });
            Object.entries(cbGrouped).forEach(([source, cats]) => {
                const div = document.createElement('div');
                div.innerHTML = `<div class="section-header">${source}</div>`;
                const list = document.createElement('div');
                list.className = 'list';
                cats.forEach(c => {
                    list.innerHTML += `<div class="item"><div class="item-icon">${getSmartIcon(c.category)}</div><div class="item-info"><span class="item-name">${c.category}</span></div><span class="item-val" style="color: var(--accent)">${c.percent}%</span></div>`;
                });
                div.appendChild(list);
                cbList.appendChild(div);
            });

            document.getElementById('totalNet').innerText = `${total.toLocaleString()} ₽`;
            document.getElementById('netCard').className = total >= 0 ? 'net-card positive' : 'net-card';
        }

        function filterCash(s) { currentCashFilter = s; render(); }

        function showSheet(id, isEdit = false) {
            const sheet = document.getElementById(id);
            if (!isEdit) { sheet.querySelectorAll('input').forEach(i => i.value = ''); sheet.querySelectorAll('select').forEach(s => s.selectedIndex = 0); }
            document.getElementById('overlay').classList.add('active');
            sheet.classList.add('active');
            tg.MainButton.setText('СОХРАНИТЬ').show();
            tg.MainButton.onClick(handleSaveWrapper);
            currentSheetId = id;
        }

        let currentSheetId = null;
        const handleSaveWrapper = () => handleSave(currentSheetId);
        function closeAll() { document.querySelectorAll('.sheet, .overlay').forEach(el => el.classList.remove('active')); tg.MainButton.hide(); }

        document.getElementById('mainAdd').onclick = () => showSheet('txSheet');
        document.getElementById('addProd').onclick = (e) => { e.preventDefault(); showSheet('prodSheet'); };
        document.getElementById('addCashback').onclick = () => showSheet('cashSheet');

        async function handleSave(id) {
            let endpoint = id === 'txSheet' ? '/addTransaction' : (id === 'prodSheet' ? '/addProduct' : '/addCashback');
            let data = {};
            if (id === 'txSheet') data = { type: document.getElementById('txType').value, amount: document.getElementById('txAmount').value, card: document.getElementById('txCard').value, category: document.getElementById('txCat').value };
            else if (id === 'prodSheet') data = { name: document.getElementById('pName').value, type: document.getElementById('pType').value, balance: document.getElementById('pBalance').value };
            else data = { source: document.getElementById('cashSource').value, category: document.getElementById('cashCat').value, percent: document.getElementById('cashPercent').value, period: document.getElementById('cashPeriod').value };

            tg.MainButton.showProgress();
            try {
                const res = await fetch(`${API_URL}${endpoint}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
                if (res.ok) { tg.HapticFeedback.notificationOccurred('success'); closeAll(); init(); }
            } catch (e) { alert('Ошибка'); }
            finally { tg.MainButton.hideProgress(); }
        }

        init();
    </script>
</body>
</html>
