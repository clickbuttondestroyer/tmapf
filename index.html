<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouFi Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ... Весь предыдущий CSS остается ... */
        :root {
            --bg-color: #f2f2f7;
            --text-main: #000000;
            --text-muted: #8e8e93;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: rgba(255, 255, 255, 0.8);
            --accent: #007aff;
            --balance-bg: linear-gradient(135deg, #1d1d1f 0%, #434353 100%);
            --balance-text: #ffffff;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.03);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.08);
            --sheet-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-main: #ffffff;
                --text-muted: #ebebf599;
                --card-bg: rgba(28, 28, 30, 0.6);
                --card-border: rgba(255, 255, 255, 0.05);
                --balance-bg: linear-gradient(135deg, #007aff 0%, #004080 100%);
                --shadow-sm: 0 4px 15px rgba(0,0,0,0.2);
                --shadow-md: 0 10px 30px rgba(0,0,0,0.4);
                --sheet-bg: #1c1c1e;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            margin: 0; padding: 20px 20px 100px 20px;
            -webkit-font-smoothing: antialiased; transition: background-color 0.3s ease;
        }

        /* Старые стили карточек (скопированы из предыдущего этапа для компактности) */
        .balance-card { background: var(--balance-bg); color: var(--balance-text); border-radius: 28px; padding: 30px 24px; text-align: center; box-shadow: var(--shadow-md); margin-bottom: 32px; position: relative; overflow: hidden; }
        .balance-title { font-size: 14px; font-weight: 500; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .balance-amount { font-size: 46px; font-weight: 700; letter-spacing: -1px; }
        .section-header { font-size: 20px; font-weight: 600; margin: 0 0 16px 8px; display: flex; justify-content: space-between; align-items: center; }
        .list-container { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 24px; padding: 8px 20px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
        .list-item { display: flex; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--card-border); }
        .list-item:last-child { border-bottom: none; }
        .bank-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 16px; }
        .dot-tbank { background-color: #ffdd2d; } .dot-sber { background-color: #21a038; } .dot-cash { background-color: #8e8e93; } .dot-debt { background-color: #ff3b30; }
        .item-details { flex-grow: 1; }
        .item-name { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .item-subtitle { font-size: 13px; color: var(--text-muted); }
        .item-value { font-size: 17px; font-weight: 600; }
        
        .fab-wrapper { position: fixed; bottom: 32px; left: 0; width: 100%; display: flex; justify-content: center; pointer-events: none; z-index: 10; }
        .fab { pointer-events: auto; background: var(--text-main); color: var(--bg-color); width: 64px; height: 64px; border-radius: 32px; display: flex; justify-content: center; align-items: center; font-size: 32px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); border: none; cursor: pointer; transition: transform 0.2s; }
        .fab:active { transform: scale(0.85); }

        /* НОВЫЕ СТИЛИ: Всплывающая шторка (Bottom Sheet) */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 90;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--sheet-bg); border-radius: 30px 30px 0 0;
            padding: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 100; display: flex; flex-direction: column; gap: 20px;
        }
        .bottom-sheet.active { transform: translateY(0); }

        /* Переключатель Типа операции */
        .segmented-control {
            display: flex; background: var(--bg-color); border-radius: 12px; padding: 4px;
        }
        .segment-btn {
            flex: 1; text-align: center; padding: 8px 0; border-radius: 10px;
            font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.2s;
            color: var(--text-muted); border: none; background: transparent;
        }
        .segment-btn.active { background: var(--sheet-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* Огромный ввод суммы */
        .amount-input-wrapper { text-align: center; margin: 10px 0; }
        .amount-input {
            width: 100%; border: none; background: transparent; text-align: center;
            font-size: 48px; font-weight: 700; color: var(--text-main);
            outline: none; padding: 0;
        }
        .amount-input::placeholder { color: var(--text-muted); opacity: 0.5; }

        /* Селекты и инпуты */
        .form-group select, .form-group input {
            width: 100%; padding: 16px; border-radius: 16px;
            background: var(--bg-color); border: 1px solid var(--card-border);
            color: var(--text-main); font-size: 17px; outline: none; margin-bottom: 12px;
            appearance: none; /* Убираем стандартную стрелочку */
        }
    </style>
</head>
<body>

    <div class="balance-card">
        <div class="balance-title">Чистые активы</div>
        <div class="balance-amount" id="main-balance">125 000 ₽</div>
    </div>

    <div class="section-header">Мои активы</div>
    <div class="list-container">
        <div class="list-item">
            <div class="bank-dot dot-tbank"></div>
            <div class="item-details"><div class="item-name">Т-Банк Black</div></div>
            <div class="item-value">85 000 ₽</div>
        </div>
    </div>

    <div class="fab-wrapper">
        <button class="fab" id="addBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
        
        <div class="segmented-control" id="typeToggle">
            <button class="segment-btn active" data-type="Расход">Расход</button>
            <button class="segment-btn" data-type="Доход">Доход</button>
            <button class="segment-btn" data-type="Перевод">Перевод</button>
        </div>

        <div class="amount-input-wrapper">
            <input type="number" id="formAmount" class="amount-input" placeholder="0 ₽" inputmode="decimal">
        </div>

        <div class="form-group">
            <select id="formCard">
                <option value="" disabled selected>Выберите карту/счет</option>
                <option value="Т-Банк Black">Т-Банк Black</option>
                <option value="Сбербанк">Сбербанк</option>
                <option value="Наличные">Наличные</option>
            </select>
            
            <select id="formCategory">
                <option value="" disabled selected>Категория</option>
                <option value="Продукты">🛒 Продукты</option>
                <option value="Кафе и рестораны">🍔 Кафе и рестораны</option>
                <option value="Транспорт">🚕 Транспорт</option>
                <option value="Здоровье">💊 Здоровье</option>
                <option value="Развлечения">🍿 Развлечения</option>
            </select>

            <input type="text" id="formDescription" placeholder="Комментарий (необязательно)">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.setHeaderColor('bg_color');
        tg.setBackgroundColor('bg_color');

        // ==== НАСТРОЙКИ ====
        // ВАЖНО! ЗАМЕНИ НА СВОЮ ССЫЛКУ!
        const API_URL = 'https://tmapf.vercel.app/api/addTransaction'; 
        // ===================

        // Элементы
        const addBtn = document.getElementById('addBtn');
        const overlay = document.getElementById('overlay');
        const bottomSheet = document.getElementById('bottomSheet');
        const typeButtons = document.querySelectorAll('.segment-btn');
        let currentType = 'Расход';

        // Открытие шторки
        addBtn.addEventListener('click', () => {
            tg.HapticFeedback.impactOccurred('medium');
            overlay.classList.add('active');
            bottomSheet.classList.add('active');
            addBtn.style.display = 'none'; // Прячем плюс

            // Настраиваем и показываем главную кнопку Telegram
            tg.MainButton.setText('СОХРАНИТЬ');
            tg.MainButton.color = tg.themeParams.button_color || '#007aff';
            tg.MainButton.show();
        });

        // Закрытие шторки при клике на темный фон
        overlay.addEventListener('click', closeSheet);

        function closeSheet() {
            overlay.classList.remove('active');
            bottomSheet.classList.remove('active');
            addBtn.style.display = 'flex';
            tg.MainButton.hide();
        }

        // Переключение типа (Расход/Доход/Перевод)
        typeButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                tg.HapticFeedback.impactOccurred('light');
                typeButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentType = e.target.dataset.type;
                
                // Меняем цвет главной кнопки: Красный для расхода, Зеленый для дохода
                if(currentType === 'Расход') tg.MainButton.color = '#ff3b30';
                else if(currentType === 'Доход') tg.MainButton.color = '#34c759';
                else tg.MainButton.color = '#007aff';
            });
        });

        // Обработка нажатия на кнопку "СОХРАНИТЬ" в Telegram
        tg.MainButton.onClick(async () => {
            const amountStr = document.getElementById('formAmount').value;
            const card = document.getElementById('formCard').value;
            const category = document.getElementById('formCategory').value;
            const description = document.getElementById('formDescription').value;

            if (!amountStr || !card || !category) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Пожалуйста, введите сумму, карту и категорию!');
                return;
            }

            // Формируем дату и время прямо сейчас
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU');
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

            // Показываем индикатор загрузки на кнопке
            tg.MainButton.showProgress();

            const payload = {
                type: currentType,
                date: dateStr,
                time: timeStr,
                amount: parseFloat(amountStr),
                card: card,
                category: category,
                description: description,
                cardAfterBalance: 0 // Пока ставим 0, потом сделаем расчет
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    tg.HapticFeedback.notificationOccurred('success');
                    
                    // Очищаем форму
                    document.getElementById('formAmount').value = '';
                    document.getElementById('formDescription').value = '';
                    
                    closeSheet();
                } else {
                    throw new Error('Ошибка сервера');
                }
            } catch (err) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Ошибка отправки: ' + err.message);
            } finally {
                tg.MainButton.hideProgress();
            }
        });
    </script>
</body>
</html>
